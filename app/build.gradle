plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'com.latintrout.eyetoycam'
    compileSdk 35

    defaultConfig {
        applicationId 'com.latintrout.eyetoycam'
        minSdk 29
        targetSdk 35
        versionCode buildNumber
        versionName "0.1." + buildNumber
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        fixed {
            // Fixed key so each new build installs over the old one.
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
